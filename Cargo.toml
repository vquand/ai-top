[package]
name = "ai-top"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A Rust terminal monitor for local AI quotas and project agent trees"
repository = "https://github.com/vquand/ai-top"
readme = "README.md"

[dependencies]
chrono = "0.4.45"
crossterm = "0.28.1"
libc = "0.2.189"
ratatui = { version = "0.29.0", default-features = false, features = ["crossterm"] }
rusqlite = "0.32.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
ureq = { version = "3.5.0", features = ["json"] }
